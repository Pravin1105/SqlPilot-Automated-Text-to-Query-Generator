name: SQLPilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff

      - name: Check Syntax & Code Style
        run: |
          python -m py_compile config.py sqlpilot/cli.py sqlpilot/core/*.py sqlpilot/db/*.py eval/*.py tests/*.py
          ruff check . --select=E,F,W --ignore=E501

  test:
    name: Unit & Security Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --no-build-isolation -e .

      - name: Seed Sample Database
        run: |
          python -m sqlpilot.db.sample_db_builder

      - name: Run Pytest Suite
        run: |
          pytest tests/ --verbose

  eval-benchmark:
    name: Evaluation Benchmark Suite
    runs-on: ubuntu-latest
    needs: test

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --no-build-isolation -e .

      - name: Run Benchmark Suite
        run: |
          python eval/runner.py
