[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlpilot"
version = "0.1.0"
description = "Schema-aware, AI-assisted database interface that converts natural language into SQL with deterministic validation, safety classification, human authorization, and controlled execution."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sqlglot>=23.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "google-genai>=0.1.0",
]

[project.scripts]
sqlpilot = "sqlpilot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlpilot*"]
